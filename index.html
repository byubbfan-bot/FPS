<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Road to the Show: Pro Hitting Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #06090e;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 14px;
        }
        .cabinet {
            background: #0f141c;
            border: 2px solid #21262d;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(0, 206, 203, 0.25);
            overflow: hidden;
            width: 860px;
        }
        .header-bar {
            background: #0a0d14;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00cecb;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .pill {
            background: #e3b341;
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            margin-right: 8px;
        }
        canvas {
            display: block;
            width: 860px;
            height: 520px;
            background: #000;
            cursor: pointer;
        }
        .footer-bar {
            background: #0a0d14;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1f2937;
            font-size: 13px;
        }
        .key-badge {
            background: #1f2937;
            border: 1px solid #374151;
            color: #e3b341;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn-action {
            background: #00cecb;
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .btn-action:hover {
            background: #38efec;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<div class="cabinet">
    <div class="header-bar">
        <div><span class="pill">RTTS</span> <span id="tier-name">SINGLE-A AFFILIATE</span></div>
        <div id="career-statline" style="color: #00cecb;">AVG: .000 | HR: 0 | OVR: 65</div>
    </div>

    <canvas id="gameCanvas" width="860" height="520"></canvas>

    <div class="footer-bar">
        <div>
            <span class="key-badge">SPACE / LEFT CLICK</span> Swing Bat &nbsp;|&nbsp; 
            <span class="key-badge">P</span> Toggle Pitcher Delivery
        </div>
        <button class="btn-action" onclick="forceNextPitch()">Next Pitch ➔</button>
    </div>
</div>

<script>
/* ==========================================================================
   AUDIO SYNTHESIZER (CRACKS, CROWDS, MITT POPS)
   ========================================================================== */
let audioCtx = null;
function playSound(type) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const t = audioCtx.currentTime;

        if (type === "crack") {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(460, t);
            osc.frequency.exponentialRampToValueAtTime(90, t + 0.16);
            gain.gain.setValueAtTime(0.8, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.16);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.16);
        } else if (type === "pop") {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(140, t);
            osc.frequency.linearRampToValueAtTime(50, t + 0.08);
            gain.gain.setValueAtTime(0.4, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.08);
        } else if (type === "cheer") {
            const bufferSize = audioCtx.sampleRate * 0.45;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.setValueAtTime(850, t);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.45);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(t);
            noise.stop(t + 0.45);
        }
    } catch(e) {}
}

/* ==========================================================================
   GAME STATE & ROAD TO THE SHOW CAREER
   ========================================================================== */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const TIERS = [
    { name: "Single-A: Modesto Nuts", pitcher: "C. Hammer", velo: 91, pitchDelay: 1100, targetXP: 100 },
    { name: "Double-A: Travelers", pitcher: "J. Santos", velo: 95, pitchDelay: 980, targetXP: 240 },
    { name: "Triple-A: Rainiers", pitcher: "T. Vance", velo: 98, pitchDelay: 880, targetXP: 450 },
    { name: "MLB: The Show", pitcher: "G. Cole", velo: 101, pitchDelay: 800, targetXP: 9999 }
];

const player = {
    name: "Brennan",
    tierIdx: 0,
    contact: 65,
    power: 62,
    xp: 0,
    ab: 0,
    hits: 0,
    hrs: 0
};

// Hitting & Ball Flight Mechanics
const atBat = {
    balls: 0,
    strikes: 0,
    phase: "WAITING", // WAITING, WINDUP, THROWN, CONTACT, RESOLVED
    pitchProgress: 0, // 0.0 to 1.0
    pitchStartX: 430,
    pitchStartY: 175,
    pitchTargetX: 430,
    pitchTargetY: 420,
    ballX: 430,
    ballY: 175,
    ballScale: 0.3,
    
    // Timing Meter: 0.0 (Early) to 1.0 (Late), 0.85 = Sweet Spot
    swingActive: false,
    swingTimer: 0,
    hitFeed: "WAITING FOR PITCH...",
    feedbackColor: "#9ca3af",
    hitDistance: 0,
    exitVelo: 0,
    
    // Hit Ball Animation
    hitBallActive: false,
    hitBallX: 430,
    hitBallY: 420,
    hitBallVX: 0,
    hitBallVY: 0,
    hitBallScale: 1.0
};

/* ==========================================================================
   INPUTS (MOUSE CLICK & SPACEBAR)
   ========================================================================== */
window.addEventListener("keydown", e => {
    if (e.code === "Space") handleSwingAttempt();
    if (e.key.toLowerCase() === "p") forceNextPitch();
});
canvas.addEventListener("mousedown", handleSwingAttempt);

function forceNextPitch() {
    if (atBat.phase === "WAITING" || atBat.phase === "RESOLVED") {
        queuePitch();
    }
}

function queuePitch() {
    atBat.phase = "WINDUP";
    atBat.hitFeed = "PITCHER DELIVERING...";
    atBat.feedbackColor = "#e3b341";
    
    setTimeout(() => {
        atBat.phase = "THROWN";
        atBat.pitchProgress = 0;
        atBat.pitchStartX = 430;
        atBat.pitchStartY = 175;
        // Pitch location within strike zone: X 405-455, Y 395-440
        atBat.pitchTargetX = 410 + Math.random() * 40;
        atBat.pitchTargetY = 400 + Math.random() * 35;
    }, 600);
}

/* ==========================================================================
   EASY, ACCESSIBLE, AND SATISFYING HITTING LOGIC
   ========================================================================== */
function handleSwingAttempt() {
    if (atBat.swingActive) return;
    atBat.swingActive = true;
    atBat.swingTimer = 0;

    if (atBat.phase === "THROWN") {
        // Ideal window is between 0.78 and 0.94 progress
        let timing = atBat.pitchProgress;
        let delta = timing - 0.86;

        if (Math.abs(delta) <= 0.12) {
            // SUCCESSFUL HIT
            atBat.phase = "CONTACT";
            playSound("crack");
            playSound("cheer");

            player.ab++;
            player.hits++;

            // Evaluate Perfect vs Good
            let isPerfect = Math.abs(delta) <= 0.05;
            atBat.exitVelo = Math.round(98 + (player.power * 0.2) + (isPerfect ? 8 : (Math.random() * 4)));
            
            if (isPerfect && atBat.exitVelo >= 104) {
                // HOME RUN!
                player.hrs++;
                player.xp += 40;
                atBat.hitDistance = Math.round(390 + (atBat.exitVelo - 100) * 5 + Math.random() * 20);
                atBat.hitFeed = `🔥 PERFECT TIMING! HOME RUN! (${atBat.hitDistance} FT, ${atBat.exitVelo} MPH)`;
                atBat.feedbackColor = "#22c55e";
                launchHitBall(true);
            } else {
                // CLEAN BASE HIT / DOUBLE
                player.xp += 20;
                atBat.hitDistance = Math.round(260 + Math.random() * 70);
                atBat.hitFeed = `⚾ SOLID CONTACT! BASE HIT! (${atBat.exitVelo} MPH)`;
                atBat.feedbackColor = "#38bdf8";
                launchHitBall(false);
            }

            updateUI();
            checkCallUpPromotion();
            setTimeout(resetAtBat, 2200);

        } else if (delta < -0.12) {
            // SWUNG TOO EARLY
            playSound("pop");
            atBat.strikes++;
            atBat.hitFeed = "EARLY SWING! Whiffed in front of the plate.";
            atBat.feedbackColor = "#f87171";
            atBat.phase = "RESOLVED";
            checkStrikes();
        } else {
            // SWUNG TOO LATE
            playSound("pop");
            atBat.strikes++;
            atBat.hitFeed = "LATE SWING! Beaten by the fastball.";
            atBat.feedbackColor = "#f87171";
            atBat.phase = "RESOLVED";
            checkStrikes();
        }
    }
}

function launchHitBall(isHR) {
    atBat.hitBallActive = true;
    atBat.hitBallX = atBat.ballX;
    atBat.hitBallY = atBat.ballY;
    atBat.hitBallVX = (Math.random() - 0.5) * 4;
    atBat.hitBallVY = isHR ? -12 : -7;
    atBat.hitBallScale = 1.0;
}

function checkStrikes() {
    updateUI();
    if (atBat.strikes >= 3) {
        player.ab++;
        atBat.hitFeed = "STRIKE THREE! Down on strikes.";
        atBat.feedbackColor = "#ef4444";
        updateUI();
        setTimeout(resetAtBat, 2000);
    } else {
        setTimeout(queuePitch, 1500);
    }
}

function resetAtBat() {
    atBat.strikes = 0;
    atBat.balls = 0;
    atBat.phase = "WAITING";
    atBat.hitBallActive = false;
    atBat.hitFeed = "READY. PRESS [SPACE] OR CLICK NEXT PITCH.";
    atBat.feedbackColor = "#9ca3af";
}

function checkCallUpPromotion() {
    let cur = TIERS[player.tierIdx];
    if (player.xp >= cur.targetXP && player.tierIdx < TIERS.length - 1) {
        player.tierIdx++;
        atBat.hitFeed = `🚨 CONGRATULATIONS! CALL-UP PROMOTION TO ${TIERS[player.tierIdx].name.toUpperCase()}!`;
        atBat.feedbackColor = "#e3b341";
        document.getElementById("tier-name").innerText = TIERS[player.tierIdx].name.toUpperCase();
    }
}

function updateUI() {
    let avg = player.ab > 0 ? (player.hits / player.ab).toFixed(3).replace(/^0/, "") : ".000";
    let ovr = Math.floor((player.contact + player.power) / 2);
    document.getElementById("career-statline").innerText = `AVG: ${avg} | HR: ${player.hrs} | OVR: ${ovr}`;
}

/* ==========================================================================
   PHYSICS & ANIMATION LOOP
   ========================================================================== */
function updatePhysics() {
    if (atBat.phase === "THROWN") {
        // High-Velo Ball Delivery
        atBat.pitchProgress += 0.024;
        atBat.ballX = atBat.pitchStartX + (atBat.pitchTargetX - atBat.pitchStartX) * atBat.pitchProgress;
        atBat.ballY = atBat.pitchStartY + (atBat.pitchTargetY - atBat.pitchStartY) * atBat.pitchProgress;
        atBat.ballScale = 0.35 + (atBat.pitchProgress * 1.3);

        // Reached plate without swing -> Called Strike / Ball
        if (atBat.pitchProgress >= 1.0) {
            atBat.phase = "RESOLVED";
            playSound("pop");
            atBat.strikes++;
            atBat.hitFeed = "CALLED STRIKE! Right down the pipe.";
            atBat.feedbackColor = "#e3b341";
            checkStrikes();
        }
    }

    if (atBat.swingActive) {
        atBat.swingTimer += 0.16;
        if (atBat.swingTimer > Math.PI) {
            atBat.swingActive = false;
        }
    }

    if (atBat.hitBallActive) {
        atBat.hitBallX += atBat.hitBallVX;
        atBat.hitBallY += atBat.hitBallVY;
        atBat.hitBallVY += 0.25; // gravity
        atBat.hitBallScale = Math.max(0.2, atBat.hitBallScale - 0.015);
    }
}

/* ==========================================================================
   HIGH-FIDELITY STADIUM & BROADCAST PRESENTATION
   ========================================================================== */
function render() {
    ctx.clearRect(0, 0, 860, 520);

    // 1. Sunset Sky Gradient with Stadium Floodlights
    let sky = ctx.createLinearGradient(0, 0, 0, 180);
    sky.addColorStop(0, "#0f172a");
    sky.addColorStop(0.6, "#1e3a8a");
    sky.addColorStop(1, "#f97316");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, 860, 180);

    // Stadium Lights & Halos
    drawStadiumLight(100, 50);
    drawStadiumLight(760, 50);

    // 2. Multi-Deck Stadium Bleachers & Crowd Silhouettes
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(60, 90, 740, 50);
    ctx.fillStyle = "#334155";
    ctx.fillRect(100, 115, 660, 25);
    // Crowd Speckles
    for (let i = 80; i < 780; i += 8) {
        ctx.fillStyle = (i % 16 === 0) ? "#38bdf8" : (i % 24 === 0) ? "#f43f5e" : "#f8fafc";
        ctx.fillRect(i, 96 + (i % 6), 5, 5);
    }

    // 3. Outfield Wall & Distance Markers
    ctx.fillStyle = "#064e3b"; // Forest green padded wall
    ctx.fillRect(0, 135, 860, 35);
    ctx.fillStyle = "#fbbf24";
    ctx.font = "800 13px sans-serif";
    ctx.fillText("330", 50, 158);
    ctx.fillText("408", 420, 158);
    ctx.fillText("330", 790, 158);

    // 4. Manicured Outfield Turf with Mower Stripes
    let grass = ctx.createLinearGradient(0, 170, 0, 520);
    grass.addColorStop(0, "#15803d");
    grass.addColorStop(1, "#14532d");
    ctx.fillStyle = grass;
    ctx.fillRect(0, 170, 860, 350);

    // Mower Patterns
    ctx.fillStyle = "rgba(255,255,255,0.035)";
    for (let c = 0; c < 860; c += 50) {
        ctx.fillRect(c, 170, 25, 350);
    }

    // 5. Infield Dirt Diamond & Pitching Mound
    ctx.fillStyle = "#b4793f";
    ctx.beginPath();
    ctx.ellipse(430, 390, 280, 130, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#854d0e";
    ctx.lineWidth = 4;
    ctx.stroke();

    // Pitcher Mound & Rubber
    ctx.fillStyle = "#92400e";
    ctx.beginPath();
    ctx.ellipse(430, 195, 40, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillRect(422, 193, 16, 4); // rubber

    // 6. Home Plate & Chalked Batter's Boxes
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(430, 442);
    ctx.lineTo(440, 432);
    ctx.lineTo(440, 422);
    ctx.lineTo(420, 422);
    ctx.lineTo(420, 432);
    ctx.closePath();
    ctx.fill();

    // Chalk Lines
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.lineWidth = 3;
    ctx.strokeRect(360, 395, 45, 65); // Left box
    ctx.strokeRect(455, 395, 45, 65); // Right box

    // 7. Pitcher Model
    drawPitcher(430, 172);

    // 8. Strike Zone Overlay Reticle (Assists Player)
    ctx.strokeStyle = "rgba(0, 206, 203, 0.4)";
    ctx.lineWidth = 2;
    ctx.strokeRect(405, 395, 50, 45);

    // 9. Ball Delivery Animation
    if (atBat.phase === "THROWN") {
        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.beginPath();
        ctx.ellipse(atBat.ballX, atBat.ballY + 10 * atBat.ballScale, 4 * atBat.ballScale, 2 * atBat.ballScale, 0, 0, Math.PI * 2);
        ctx.fill();

        // Leather Baseball
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(atBat.ballX, atBat.ballY, 6 * atBat.ballScale, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#dc2626";
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    // 10. Hit Ball Rocketing into Air
    if (atBat.hitBallActive) {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(atBat.hitBallX, atBat.hitBallY, 8 * atBat.hitBallScale, 0, Math.PI * 2);
        ctx.fill();
    }

    // 11. Upgraded Realistic Batter Sprite (Fluid Recoil)
    drawBatter(378, 425, atBat.swingActive, atBat.swingTimer);

    // 12. Broadcast Scorebug HUD & Timing Feedback
    renderBroadcastHUD();
}

function drawStadiumLight(x, y) {
    ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
    ctx.beginPath();
    ctx.arc(x, y, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x - 15, y - 6, 30, 12);
}

function drawPitcher(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // Pants & Legs
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(-6, 2, 5, 18);
    ctx.fillRect(1, 2, 5, 18);
    // Jersey
    ctx.fillStyle = "#0c2340";
    ctx.fillRect(-8, -12, 16, 16);
    // Glove & Ball Hand
    ctx.fillStyle = "#854d0e";
    ctx.fillRect(-12, -8, 6, 6);
    // Head & Cap
    ctx.fillStyle = "#dfa070";
    ctx.beginPath();
    ctx.arc(0, -16, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#0c2340";
    ctx.fillRect(-4, -21, 8, 4);

    ctx.restore();
}

function drawBatter(x, y, isSwinging, swingProgress) {
    ctx.save();
    ctx.translate(x, y);

    // Drop Shadow
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.ellipse(0, 12, 18, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Spiked Cleats
    ctx.fillStyle = "#111";
    ctx.fillRect(-8, 8, 6, 6);
    ctx.fillRect(4, 8, 6, 6);

    // Home White Pinstripe Pants
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(-9, -8, 7, 18);
    ctx.fillRect(3, -8, 7, 18);
    ctx.fillStyle = "#0c2340"; // Pinstripes
    ctx.fillRect(-6, -8, 1, 18);
    ctx.fillRect(6, -8, 1, 18);

    // Jersey & Gold Number
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(-10, -25, 20, 18);
    ctx.fillStyle = "#0c2340";
    ctx.fillRect(-3, -25, 2, 18);

    // Arms & Batting Gloves
    ctx.fillStyle = "#dfa070";
    ctx.fillRect(6, -21, 6, 12);
    ctx.fillStyle = "#e3b341"; // Gloves
    ctx.fillRect(9, -24, 6, 6);

    // Head, Eye Black & Helmet
    ctx.fillStyle = "#dfa070";
    ctx.beginPath();
    ctx.arc(0, -30, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#000"; // Eye black
    ctx.fillRect(2, -30, 4, 1.5);

    // Pro Batting Helmet
    ctx.fillStyle = "#0c2340";
    ctx.beginPath();
    ctx.arc(0, -33, 7, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(1, -35, 7, 4); // Earflap

    // Animated Wooden Bat Swing
    ctx.save();
    ctx.translate(12, -22);
    if (isSwinging) {
        ctx.rotate(-swingProgress * 1.8);
    } else {
        ctx.rotate(0.35); // Ready stance
    }
    // Maple Wood Barrel
    ctx.fillStyle = "#b4793f";
    ctx.fillRect(-2, -38, 4, 40);
    // Pine Tar Grip
    ctx.fillStyle = "#171717";
    ctx.fillRect(-2, -12, 4, 12);
    ctx.restore();

    ctx.restore();
}

function renderBroadcastHUD() {
    // 1. Pitcher Info Scorebug (Top Left)
    ctx.fillStyle = "rgba(10, 13, 20, 0.92)";
    ctx.fillRect(20, 20, 220, 52);
    ctx.strokeStyle = "#00cecb";
    ctx.lineWidth = 2;
    ctx.strokeRect(20, 20, 220, 52);

    ctx.fillStyle = "#e3b341";
    ctx.font = "800 12px sans-serif";
    ctx.fillText(`P: ${TIERS[player.tierIdx].pitcher}`, 32, 38);
    ctx.fillStyle = "#94a3b8";
    ctx.font = "700 11px sans-serif";
    ctx.fillText(`4-SEAM FASTBALL: ${TIERS[player.tierIdx].velo} MPH`, 32, 57);

    // 2. Count Box (Top Right)
    ctx.fillStyle = "rgba(10, 13, 20, 0.92)";
    ctx.fillRect(720, 20, 120, 52);
    ctx.strokeStyle = "#e3b341";
    ctx.lineWidth = 2;
    ctx.strokeRect(720, 20, 120, 52);

    ctx.fillStyle = "#e3b341";
    ctx.font = "800 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("COUNT", 780, 36);
    ctx.fillStyle = "#00cecb";
    ctx.font = "900 20px monospace";
    ctx.fillText(`${atBat.balls} - ${atBat.strikes}`, 780, 58);

    // 3. Timing Window Meter (Assists Hitting)
    if (atBat.phase === "THROWN") {
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.fillRect(330, 20, 200, 18);
        ctx.strokeStyle = "#38bdf8";
        ctx.strokeRect(330, 20, 200, 18);

        // Sweet spot marker (85%)
        ctx.fillStyle = "rgba(34, 197, 94, 0.6)";
        ctx.fillRect(330 + (200 * 0.78), 20, 200 * 0.16, 18);

        // Progress bar
        ctx.fillStyle = "#e3b341";
        ctx.fillRect(330, 22, 200 * atBat.pitchProgress, 14);

        ctx.fillStyle = "#fff";
        ctx.font = "bold 9px sans-serif";
        ctx.fillText("TIMING ZONE", 430, 32);
    }

    // 4. Center Broadcast Lower-Third Feedback
    ctx.fillStyle = "rgba(10, 13, 20, 0.95)";
    ctx.fillRect(80, 465, 700, 44);
    ctx.strokeStyle = "#1f2937";
    ctx.strokeRect(80, 465, 700, 44);

    ctx.fillStyle = atBat.feedbackColor;
    ctx.font = "800 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(atBat.hitFeed, 430, 492);
}

/* ==========================================================================
   LOOP
   ========================================================================== */
function gameLoop() {
    updatePhysics();
    render();
    requestAnimationFrame(gameLoop);
}

// Queue opening pitch automatically on load
