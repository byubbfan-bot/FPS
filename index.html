<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road to the Show: 64-Bit Career RPG</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #080c10;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f0f6fc;
        }
        /* Arcade Cabinet / High-Fi Frame */
        .arcade-cabinet {
            background: #151a22;
            padding: 16px;
            border-radius: 14px;
            border: 2px solid #2d3748;
            box-shadow: 0 16px 40px rgba(0,0,0,0.8), 0 0 25px rgba(0, 206, 203, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .cabinet-titlebar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px 10px 8px;
            font-size: 13px;
            font-weight: 800;
            color: #00cecb;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .canvas-wrapper {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid #00cecb;
            box-shadow: inset 0 0 16px rgba(0,0,0,0.8);
            background: #000;
        }
        canvas {
            display: block;
            image-rendering: auto;
        }
        /* Mobile / Touch D-Pad */
        .controls-deck {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 14px;
            padding: 0 10px;
        }
        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 3px;
        }
        .deck-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .deck-btn:active {
            background: #00cecb;
            color: #000;
        }
        .action-cluster {
            display: flex;
            gap: 12px;
        }
        .round-action-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #238636;
            border: 2px solid #2ea043;
            color: #fff;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .round-action-btn:active {
            transform: translateY(2px);
            background: #2ea043;
        }
        .btn-b {
            background: #da3633;
            border-color: #f85149;
        }
        .btn-b:active {
            background: #f85149;
        }
        .key-hints {
            font-size: 12px;
            color: #8b949e;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="arcade-cabinet">
    <div class="cabinet-titlebar">
        <span>⚾ MLB RTTS 64-BIT EDITION</span>
        <span id="tier-indicator" style="color: #e3b341;">SINGLE-A BALLPARK</span>
    </div>

    <div class="canvas-wrapper">
        <canvas id="rtts-canvas" width="640" height="480"></canvas>
    </div>

    <div class="controls-deck">
        <div class="dpad-grid">
            <div></div><button class="deck-btn" id="d-up">▲</button><div></div>
            <button class="deck-btn" id="d-left">◀</button><div></div><button class="deck-btn" id="d-right">▶</button>
            <div></div><button class="deck-btn" id="d-down">▼</button><div></div>
        </div>

        <div style="font-size: 12px; color: #8b949e; text-align: center;">
            <strong>A</strong> = Swing / Select / Talk<br>
            <strong>B</strong> = Take Pitch / Cancel
        </div>

        <div class="action-cluster">
            <button class="round-action-btn btn-b" id="act-b">B</button>
            <button class="round-action-btn" id="act-a">A</button>
        </div>
    </div>
</div>

<div class="key-hints">
    [W, A, S, D] or [Arrows] = Walk | [Z] or [Enter] = <strong>A</strong> Button | [X] or [Backspace] = <strong>B</strong> Button
</div>

<script>
/* ==========================================================================
   AUDIO SYNTHESIZER (BAT CRACKS, CROWDS, BEEPS)
   ========================================================================== */
let audioCtx = null;
function playSound(type) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const t = audioCtx.currentTime;

        if (type === "bat_crack") {
            // High-energy wooden crack
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(320, t);
            osc.frequency.exponentialRampToValueAtTime(80, t + 0.12);
            gain.gain.setValueAtTime(0.5, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.12);
        } else if (type === "select") {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(640, t);
            gain.gain.setValueAtTime(0.08, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.05);
        } else if (type === "whiff") {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(140, t);
            osc.frequency.linearRampToValueAtTime(40, t + 0.18);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.18);
        }
    } catch(e) {}
}

/* ==========================================================================
   GAME ENGINE & ROAD TO THE SHOW STATE
   ========================================================================== */
const canvas = document.getElementById("rtts-canvas");
const ctx = canvas.getContext("2d");

const TIERS = [
    { name: "Single-A Affiliate", targetXP: 120, pitcher: "Cole Hammer", pitchVelo: "92 MPH", pitchDiff: 45 },
    { name: "Double-A (Prospects)", targetXP: 260, pitcher: "Julio Santos", pitchVelo: "96 MPH", pitchDiff: 60 },
    { name: "Triple-A (Taxi Squad)", targetXP: 450, pitcher: "Trevor Vance", pitchVelo: "99 MPH", pitchDiff: 75 },
    { name: "MLB: The Show", targetXP: 9999, pitcher: "Gerrit Cy Young", pitchVelo: "102 MPH", pitchDiff: 92 }
];

const player = {
    x: 200,
    y: 280,
    w: 24,
    h: 38,
    speed: 3.2,
    dir: "down",
    walking: false,
    frame: 0,
    // Attributes
    name: "Brennan",
    position: "SS",
    tierIdx: 0,
    contact: 55,
    power: 50,
    discipline: 52,
    speedStat: 58,
    progPoints: 0,
    energy: 100,
    hits: 0,
    ab: 0,
    hrs: 0
};

let gameState = "OVERWORLD"; // OVERWORLD, DIALOGUE, AT_BAT
let dialogueData = { speaker: "", text: "", step: 0, totalSteps: 0, cb: null };

// At-Bat Battle System
const atBat = {
    balls: 0,
    strikes: 0,
    pitcherHp: 100,
    batterHp: 100,
    pitchState: "READY", // READY, PITCHING, RESULT
    pitchBallX: 420,
    pitchBallY: 140,
    ballDestX: 200,
    ballDestY: 280,
    ballProgress: 0,
    menuCursor: 0, // 0: Contact Swing, 1: Power Swing, 2: Take Pitch, 3: Bunt
    logMsg: "Step into the batter's box! Select approach."
};

/* ==========================================================================
   INPUTS (KEYBOARD & TOUCH)
   ========================================================================== */
const keys = { up: false, down: false, left: false, right: false };

window.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === "arrowup" || k === "w") keys.up = true;
    if (k === "arrowdown" || k === "s") keys.down = true;
    if (k === "arrowleft" || k === "a") keys.left = true;
    if (k === "arrowright" || k === "d") keys.right = true;
    if (k === "z" || k === "enter" || k === " ") pressActionA();
    if (k === "x" || k === "backspace") pressActionB();
});

window.addEventListener("keyup", e => {
    const k = e.key.toLowerCase();
    if (k === "arrowup" || k === "w") keys.up = false;
    if (k === "arrowdown" || k === "s") keys.down = false;
    if (k === "arrowleft" || k === "a") keys.left = false;
    if (k === "arrowright" || k === "d") keys.right = false;
});

function bindControl(id, onDown, onUp) {
    const el = document.getElementById(id);
    el.addEventListener("mousedown", onDown);
    el.addEventListener("mouseup", onUp);
    el.addEventListener("touchstart", e => { e.preventDefault(); onDown(); });
    el.addEventListener("touchend", e => { e.preventDefault(); onUp(); });
}

bindControl("d-up", () => keys.up = true, () => keys.up = false);
bindControl("d-down", () => keys.down = true, () => keys.down = false);
bindControl("d-left", () => keys.left = true, () => keys.left = false);
bindControl("d-right", () => keys.right = true, () => keys.right = false);
document.getElementById("act-a").addEventListener("click", pressActionA);
document.getElementById("act-b").addEventListener("click", pressActionB);

function pressActionA() {
    playSound("select");
    if (gameState === "DIALOGUE") {
        advanceDialogue();
    } else if (gameState === "OVERWORLD") {
        checkOverworldInteract();
    } else if (gameState === "AT_BAT") {
        confirmAtBatSelection();
    }
}

function pressActionB() {
    if (gameState === "AT_BAT") {
        atBat.menuCursor = 2; // Jump cursor to "Take Pitch"
        confirmAtBatSelection();
    }
}

/* ==========================================================================
   OVERWORLD COLLISION & OBJECTS
   ========================================================================== */
const npcs = [
    {
        name: "Manager Skip",
        x: 140,
        y: 110,
        color: "#c68a4c",
        text: "Keep driving balls to the opposite field, Brennan! Step onto the home plate dirt to face live arms."
    },
    {
        name: "Hitting Coach",
        x: 480,
        y: 350,
        color: "#2ea043",
        text: "Let's work on hand speed! Contact rating increased by +2."
    }
];

function checkOverworldInteract() {
    for (let npc of npcs) {
        let d = Math.hypot((npc.x + 12) - (player.x + 12), (npc.y + 16) - (player.y + 20));
        if (d < 42) {
            triggerDialogue(npc.name, npc.text);
            if (npc.name === "Hitting Coach") {
                player.contact += 2;
            }
            return;
        }
    }
}

function triggerDialogue(speaker, text, cb = null) {
    gameState = "DIALOGUE";
    dialogueData = { speaker, text, step: 0, cb };
}

function advanceDialogue() {
    gameState = "OVERWORLD";
    if (dialogueData.cb) dialogueData.cb();
}

function updateOverworld() {
    if (gameState !== "OVERWORLD") return;

    let dx = 0;
    let dy = 0;

    if (keys.up) { dy -= player.speed; player.dir = "up"; }
    if (keys.down) { dy += player.speed; player.dir = "down"; }
    if (keys.left) { dx -= player.speed; player.dir = "left"; }
    if (keys.right) { dx += player.speed; player.dir = "right"; }

    player.walking = (dx !== 0 || dy !== 0);
    if (player.walking) player.frame += 0.2;

    // Arena Bounds
    let nextX = Math.max(30, Math.min(580, player.x + dx));
    let nextY = Math.max(70, Math.min(420, player.y + dy));

    player.x = nextX;
    player.y = nextY;

    // Check Home Plate Encounter Zone
    // Home plate is located at X: 290 - 350, Y: 340 - 400
    if (player.x > 290 && player.x < 350 && player.y > 340 && player.y < 400) {
        player.y = 310; // push north out of zone
        startAtBatEncounter();
    }
}

/* ==========================================================================
   AT-BAT BATTLE SYSTEM
   ========================================================================== */
function startAtBatEncounter() {
    gameState = "AT_BAT";
    atBat.balls = 0;
    atBat.strikes = 0;
    atBat.pitcherHp = 100;
    atBat.pitchState = "READY";
    atBat.menuCursor = 0;
    atBat.logMsg = `Now Batting: ${player.name} vs. ${TIERS[player.tierIdx].pitcher} (${TIERS[player.tierIdx].pitchVelo})!`;
}

function confirmAtBatSelection() {
    if (atBat.pitchState !== "READY") return;
    atBat.pitchState = "PITCHING";
    atBat.ballProgress = 0;

    const diff = TIERS[player.tierIdx].pitchDiff;

    // Pitch delivery animation then roll calculation
    setTimeout(() => {
        atBat.pitchState = "READY";
        if (atBat.menuCursor === 0) {
            // Contact Swing
            let roll = player.contact + Math.floor(Math.random() * 40);
            if (roll > diff) {
                playSound("bat_crack");
                let dmg = 35;
                atBat.pitcherHp = Math.max(0, atBat.pitcherHp - dmg);
                player.hits++;
                player.ab++;
                player.progPoints += 25;
                atBat.logMsg = "⚾ Hard lined drive through the 5-6 hole for a clean SINGLE!";
            } else {
                playSound("whiff");
                atBat.strikes++;
                atBat.logMsg = "Swing and a miss on a sharp biting slider!";
            }
        } else if (atBat.menuCursor === 1) {
            // Power Swing
            let roll = player.power + Math.floor(Math.random() * 45) - 15;
            if (roll > diff) {
                playSound("bat_crack");
                atBat.pitcherHp = 0;
                player.hits++;
                player.hrs++;
                player.ab++;
                player.progPoints += 50;
                atBat.logMsg = "🔥 CRUSHED! DEEP TO THE UPPER DECK! 440-FT HOME RUN!";
            } else {
                playSound("whiff");
                atBat.strikes++;
                atBat.logMsg = "Huge hack and missed the high heater!";
            }
        } else if (atBat.menuCursor === 2) {
            // Take Pitch
            let inZone = Math.random() < 0.60;
            if (!inZone) {
                atBat.balls++;
                atBat.logMsg = "Good eye! Slider missed low and outside. Ball!";
            } else {
                atBat.strikes++;
                atBat.logMsg = "Fastball paints the outside corner. Strike called!";
            }
        } else if (atBat.menuCursor === 3) {
            // Drag Bunt
            if (player.speedStat > 50 && Math.random() < 0.65) {
                playSound("bat_crack");
                atBat.pitcherHp = Math.max(0, atBat.pitcherHp - 30);
                player.hits++;
                player.ab++;
                player.progPoints += 20;
                atBat.logMsg = "⚡ Laid down a beauty along the third-base line! Beaten out for a hit!";
            } else {
                atBat.strikes++;
                atBat.logMsg = "Bunt popped foul back to the screen.";
            }
        }

        // Count Resolutions
        if (atBat.pitcherHp <= 0) {
            setTimeout(() => {
                triggerDialogue("Official Scorer", "You conquered the pitcher! Call-up progress rewarded!", () => {
                    checkCallUpPromotion();
                });
            }, 1000);
        } else if (atBat.strikes >= 3) {
            player.ab++;
            setTimeout(() => {
                triggerDialogue("Umpire", "STRIKE THREE! Down on strikes. Regroup in the dugout.", () => {
                    gameState = "OVERWORLD";
                });
            }, 1000);
        } else if (atBat.balls >= 4) {
            player.ab++;
            player.progPoints += 20;
            setTimeout(() => {
                triggerDialogue("Umpire", "BALL FOUR! Drew the walk and showed major-league discipline!", () => {
                    checkCallUpPromotion();
                });
            }, 1000);
        }
    }, 600);
}

function checkCallUpPromotion() {
    gameState = "OVERWORLD";
    let curTier = TIERS[player.tierIdx];
    if (player.progPoints >= curTier.targetXP && player.tierIdx < TIERS.length - 1) {
        player.tierIdx++;
        document.getElementById("tier-indicator").innerText = TIERS[player.tierIdx].name.toUpperCase();
        triggerDialogue("FRONT OFFICE GM", `🚨 CALL-UP ALERT! Pack your bags! You're promoted to ${TIERS[player.tierIdx].name}!`);
    }
}

// Menu Navigation
window.addEventListener("keydown", e => {
    if (gameState !== "AT_BAT") return;
    if (e.key === "ArrowLeft") atBat.menuCursor = Math.max(0, atBat.menuCursor - 1);
    if (e.key === "ArrowRight") atBat.menuCursor = Math.min(3, atBat.menuCursor + 1);
});

/* ==========================================================================
   64-BIT RETRO 2D GRAPHICS RENDERING
   ========================================================================== */

// Draw an authentic 64-bit Baseball Batter Sprite
function drawBaseballPlayer(x, y, dir, walking, frame) {
    ctx.save();
    ctx.translate(x, y);

    // Dynamic drop shadow
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(12, 36, 10, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Spiked Cleats
    let legOffset = walking ? Math.sin(frame * 2) * 3 : 0;
    ctx.fillStyle = "#111"; // Black cleats
    ctx.fillRect(4, 30 + legOffset, 6, 6);
    ctx.fillRect(14, 30 - legOffset, 6, 6);

    // Baseball Pants (Pinstripe Off-White)
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(4, 18, 7, 13);
    ctx.fillRect(13, 18, 7, 13);
    // Navy pinstripes
    ctx.fillStyle = "#0c2340";
    ctx.fillRect(7, 18, 1, 13);
    ctx.fillRect(16, 18, 1, 13);

    // Belt & Buckle
    ctx.fillStyle = "#0c2340";
    ctx.fillRect(4, 17, 16, 2);
    ctx.fillStyle = "#d4af37";
    ctx.fillRect(11, 17, 2, 2);

    // Jersey (Authentic team uniform)
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(3, 8, 18, 10);
    // Pinstripes
    ctx.fillStyle = "#0c2340";
    ctx.fillRect(7, 8, 1, 10);
    ctx.fillRect(12, 8, 1, 10);
    ctx.fillRect(16, 8, 1, 10);

    // Head / Facial Hair Stubble & Skin
    ctx.fillStyle = "#dca176"; // Skin tone
    ctx.fillRect(7, 3, 10, 7);
    ctx.fillStyle = "#4a3319"; // Beard stubble along jaw
    ctx.fillRect(7, 7, 10, 3);

    // Batting Helmet (Navy Blue with shine highlight)
    ctx.fillStyle = "#0c2340";
    ctx.fillRect(6, 0, 12, 5);
    ctx.fillStyle = "#1f4a7c"; // Earflap & crown highlight
    ctx.fillRect(7, 1, 4, 2);

    // Wooden Maple Baseball Bat
    ctx.fillStyle = "#b4793f"; // Maple wood
    if (dir === "down" || dir === "right") {
        ctx.fillRect(20, 2, 3, 24);
        ctx.fillStyle = "#1a1a1a"; // Pine tar grip
        ctx.fillRect(20, 18, 3, 8);
    } else {
        ctx.fillRect(1, 2, 3, 24);
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(1, 18, 3, 8);
    }

    ctx.restore();
}

function renderOverworld() {
    // 1. Manicured Ballpark Outfield & Infield Turf
    ctx.fillStyle = "#2d6a4f";
    ctx.fillRect(0, 0, 640, 480);

    // Field mower pattern stripes (Classic MLB diamond aesthetic)
    ctx.fillStyle = "rgba(255,255,255,0.04)";
    for (let c = 0; c < 640; c += 40) {
        ctx.fillRect(c, 0, 20, 480);
    }

    // 2. Infield Clay Dirt Diamond
    ctx.fillStyle = "#b07d4b";
    ctx.beginPath();
    ctx.moveTo(320, 130); // 2nd base
    ctx.lineTo(440, 250); // 1st base
    ctx.lineTo(320, 370); // Home plate
    ctx.lineTo(200, 250); // 3rd base
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#8d5b32";
    ctx.lineWidth = 4;
    ctx.stroke();

    // Grass diamond cutout inside bases
    ctx.fillStyle = "#2d6a4f";
    ctx.beginPath();
    ctx.moveTo(320, 175);
    ctx.lineTo(395, 250);
    ctx.lineTo(320, 325);
    ctx.lineTo(245, 250);
    ctx.closePath();
    ctx.fill();

    // Foul lines
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(320, 370); ctx.lineTo(600, 90);  // Right foul line
    ctx.moveTo(320, 370); ctx.lineTo(40, 90);   // Left foul line
    ctx.stroke();

    // Pitcher Mound & Rubber
    ctx.fillStyle = "#9a6538";
    ctx.beginPath();
    ctx.arc(320, 250, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(315, 248, 10, 4);

    // Home Plate & Batter's Boxes
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(316, 366, 8, 8); // Home plate
    // Chalk lines for batter's box
    ctx.strokeStyle = "#ffffff";
    ctx.strokeRect(298, 355, 14, 28); // Left box
    ctx.strokeRect(328, 355, 14, 28); // Right box

    // Stadium Dugout Wall & Railing
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(20, 430, 600, 50);
    ctx.fillStyle = "#475569";
    ctx.fillRect(20, 426, 600, 4); // Railing

    // Scoreboard in Centerfield
    ctx.fillStyle = "#090d16";
    ctx.fillRect(210, 10, 220, 50);
    ctx.strokeStyle = "#e3b341";
    ctx.lineWidth = 2;
    ctx.strokeRect(210, 10, 220, 50);
    ctx.fillStyle = "#e3b341";
    ctx.font = "bold 11px monospace";
    ctx.fillText("SCOREBOARD", 280, 24);
    ctx.fillStyle = "#00cecb";
    ctx.fillText(`AVG: .${player.ab > 0 ? Math.round((player.hits/player.ab)*1000) : "000"}  HR: ${player.hrs}  CALL-UP XP: ${player.progPoints}/${TIERS[player.tierIdx].targetXP}`, 220, 44);

    // Render NPCs
    for (let npc of npcs) {
        drawBaseballPlayer(npc.x, npc.y, "down", false, 0);
        ctx.fillStyle = "#f0f6fc";
        ctx.font = "bold 10px sans-serif";
        ctx.fillText(npc.name, npc.x - 10, npc.y - 4);
    }

    // Render Player
    drawBaseballPlayer(player.x, player.y, player.dir, player.walking, player.frame);

    // Interactive prompt near plate
    if (player.x > 270 && player.x < 370 && player.y > 320 && player.y < 410) {
        ctx.fillStyle = "rgba(0, 206, 203, 0.9)";
        ctx.fillRect(245, 310, 150, 22);
        ctx.fillStyle = "#000";
        ctx.font = "bold 10px sans-serif";
        ctx.fillText("PRESS [A] FOR LIVE AT-BAT", 250, 325);
    }

    // Top-Left Player Profile HUD
    ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(10, 10, 185, 48);
    ctx.strokeStyle = "#00cecb";
    ctx.strokeRect(10, 10, 185, 48);
    ctx.fillStyle = "#00cecb";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText(`${player.name} (${player.position}) - ${TIERS[player.tierIdx].name}`, 18, 25);
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "10px monospace";
    ctx.fillText(`CON:${player.contact} PWR:${player.power} EYE:${player.discipline} SPD:${player.speedStat}`, 18, 42);
}

function renderAtBatScene() {
    // 64-bit Televised Broadcast At-Bat Presentation
    // Centerfield broadcast camera angle
    ctx.fillStyle = "#1e3a1e";
    ctx.fillRect(0, 0, 640, 320);

    // Dirt circle behind plate
    ctx.fillStyle = "#a26e3c";
    ctx.beginPath();
    ctx.ellipse(320, 250, 180, 70, 0, 0, Math.PI * 2);
    ctx.fill();

    // Home plate & Batter Box chalk
    ctx.fillStyle = "#fff";
    ctx.fillRect(314, 260, 12, 10);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.strokeRect(260, 225, 36, 65);
    ctx.strokeRect(344, 225, 36, 65);

    // Opposing Pitcher on the Mound
    ctx.fillStyle = "#222";
    ctx.beginPath();
    ctx.ellipse(320, 100, 30, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    drawBaseballPlayer(308, 64, "down", false, 0);

    // Batter in Left Batter's Box (Back/side 3/4 view facing pitcher)
    drawBaseballPlayer(266, 215, "up", false, 0);

    // Ball Animation
    if (atBat.pitchState === "PITCHING") {
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(320, 110 + (Math.random() * 120), 4, 0, Math.PI * 2);
        ctx.fill();
    }

    // Broadcast TV HUD (Pitcher Top-Left, Count Top-Right)
    ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
    ctx.fillRect(20, 16, 210, 48);
    ctx.strokeStyle = "#e3b341";
    ctx.strokeRect(20, 16, 210, 48);
    ctx.fillStyle = "#e3b341";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText(`P: ${TIERS[player.tierIdx].pitcher} (${TIERS[player.tierIdx].pitchVelo})`, 28, 32);
    // Stamina Bar
    ctx.fillStyle = "#334155";
    ctx.fillRect(28, 42, 180, 8);
    ctx.fillStyle = "#22c55e";
    ctx.fillRect(28, 42, Math.floor(180 * (atBat.pitcherHp / 100)), 8);

    // Balls / Strikes Dashboard
    ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
    ctx.fillRect(510, 16, 110, 48);
    ctx.strokeStyle = "#00cecb";
    ctx.strokeRect(510, 16, 110, 48);
    ctx.fillStyle = "#00cecb";
    ctx.font = "bold 14px monospace";
    ctx.fillText(`COUNT`, 538, 34);
    ctx.fillStyle = "#e3b341";
    ctx.fillText(`${atBat.balls} - ${atBat.strikes}`, 544, 52);

    // Bottom Command Console
    ctx.fillStyle = "#0d1117";
    ctx.fillRect(0, 320, 640, 160);
    ctx.strokeStyle = "#30363d";
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 320, 640, 160);

    // Message Log
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "bold 13px 'Segoe UI', sans-serif";
    ctx.fillText(atBat.logMsg, 30, 350);

    // Action Menu Options
    const menuOptions = ["Contact Swing [A]", "Power Swing", "Take Pitch [B]", "Drag Bunt"];
    for (let i = 0; i < 4; i++) {
        let bx = 30 + (i * 145);
        let by = 385;
        let isSelected = (atBat.menuCursor === i);

        ctx.fillStyle = isSelected ? "#00cecb" : "#21262d";
        ctx.fillRect(bx, by, 135, 45);
        ctx.strokeStyle = isSelected ? "#ffffff" : "#30363d";
        ctx.lineWidth = isSelected ? 2 : 1;
        ctx.strokeRect(bx, by, 135, 45);

        ctx.fillStyle = isSelected ? "#000000" : "#ffffff";
        ctx.font = "bold 11px sans-serif";
        ctx.fillText(menuOptions[i], bx + 12, by + 26);
    }
}

function renderDialogue() {
    ctx.fillStyle = "rgba(13, 17, 23, 0.96)";
    ctx.fillRect(30, 330, 580, 110);
    ctx.strokeStyle = "#00cecb";
    ctx.lineWidth = 2;
    ctx.strokeRect(30, 330, 580, 110);

    ctx.fillStyle = "#e3b341";
    ctx.font = "bold 14px sans-serif";
    ctx.fillText(dialogueData.speaker, 50, 355);

    ctx.fillStyle = "#ffffff";
    ctx.font = "13px sans-serif";
    ctx.fillText(dialogueData.text, 50, 385);

    ctx.fillStyle = "#8b949e";
    ctx.font = "11px monospace";
    ctx.fillText("Press [A] or [ENTER] to continue...", 420, 425);
}

/* ==========================================================================
   MAIN GAME LOOP
   ========================================================================== */
function gameLoop() {
    updateOverworld();

    ctx.clearRect(0, 0, 640, 480);
    if (gameState === "OVERWORLD") {
        renderOverworld();
    } else if (gameState === "AT_BAT") {
        renderAtBatScene();
    } else if (gameState === "DIALOGUE") {
        renderOverworld();
        renderDialogue();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
