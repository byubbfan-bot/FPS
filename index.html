<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Three.js FPS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
    }
    #crosshair::before {
      top: 4px; left: -8px; width: 26px; height: 2px;
    }
    #crosshair::after {
      top: -8px; left: 4px; width: 2px; height: 26px;
    }
    #hud {
      position: absolute;
      bottom: 24px;
      left: 24px;
      color: #fff;
      font-size: 20px;
      letter-spacing: 1px;
      z-index: 10;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }
    #blocker {
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      cursor: pointer;
      z-index: 20;
    }
    #blocker h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }
    #blocker p {
      font-size: 16px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>AMMO: <span id="ammo">30</span> / ∞ (Press R to reload)</div>
  </div>

  <div id="blocker">
    <h1>CLICK TO PLAY</h1>
    <p>WASD to Move &nbsp;|&nbsp; Mouse to Aim &nbsp;|&nbsp; Left Click to Shoot &nbsp;|&nbsp; R to Reload</p>
  </div>

  <!-- Include Three.js and PointerLockControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

  <script>
    // --- Core Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a202c);
    scene.fog = new THREE.Fog(0x1a202c, 20, 80);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // --- Environment: Floor and Boundary Walls ---
    const floorGeo = new THREE.PlaneGeometry(100, 100);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x2d3748, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(100, 50, 0x4a5568, 0x374151);
    grid.position.y = 0.01;
    scene.add(grid);

    // Obstacles / Cover
    const boxGeo = new THREE.BoxGeometry(3, 3, 3);
    const boxMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, roughness: 0.6 });
    for (let i = 0; i < 16; i++) {
      const box = new THREE.Mesh(boxGeo, boxMat);
      box.position.x = (Math.random() - 0.5) * 60;
      box.position.z = (Math.random() - 0.5) * 60;
      box.position.y = 1.5;
      box.castShadow = true;
      box.receiveShadow = true;
      scene.add(box);
    }

    // --- Gun Model Attached to Camera ---
    const gunGroup = new THREE.Group();
    const gunBodyGeo = new THREE.BoxGeometry(0.12, 0.15, 0.6);
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
    const gunBody = new THREE.Mesh(gunBodyGeo, gunMat);

    const barrelGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.4);
    const barrel = new THREE.Mesh(barrelGeo, gunMat);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 0.04, -0.35);

    gunGroup.add(gunBody);
    gunGroup.add(barrel);
    gunGroup.position.set(0.25, -0.22, -0.5);
    camera.add(gunGroup);
    scene.add(camera);

    // --- Controls & Pointer Lock ---
    const controls = new THREE.PointerLockControls(camera, document.body);
    const blocker = document.getElementById('blocker');

    blocker.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => blocker.style.display = 'none');
    controls.addEventListener('unlock', () => blocker.style.display = 'flex');

    camera.position.set(0, 1.7, 0); // Average eye level

    const moveState = { forward: false, backward: false, left: false, right: false };
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let prevTime = performance.now();

    window.addEventListener('keydown', (e) => {
      switch (e.code) {
        case 'KeyW': moveState.forward = true; break;
        case 'KeyS': moveState.backward = true; break;
        case 'KeyA': moveState.left = true; break;
        case 'KeyD': moveState.right = true; break;
        case 'KeyR': reload(); break;
      }
    });

    window.addEventListener('keyup', (e) => {
      switch (e.code) {
        case 'KeyW': moveState.forward = false; break;
        case 'KeyS': moveState.backward = false; break;
        case 'KeyA': moveState.left = false; break;
        case 'KeyD': moveState.right = false; break;
      }
    });

    // --- Targets & Game Logic ---
    let score = 0;
    let ammo = 30;
    const maxAmmo = 30;
    let isReloading = false;
    const targets = [];
    const targetGeo = new THREE.SphereGeometry(1, 16, 16);

    function spawnTarget() {
      const targetMat = new THREE.MeshStandardMaterial({
        color: 0xe53e3e,
        roughness: 0.4,
        emissive: 0x9b2c2c,
        emissiveIntensity: 0.3
      });
      const target = new THREE.Mesh(targetGeo, targetMat);
      target.position.x = (Math.random() - 0.5) * 50;
      target.position.y = 1.5 + Math.random() * 3;
      target.position.z = (Math.random() - 0.5) * 50;
      target.castShadow = true;

      // Ensure target doesn't spawn right on top of the player
      if (target.position.distanceTo(camera.position) < 8) {
        target.position.z += 12;
      }

      scene.add(target);
      targets.push(target);
    }

    for (let i = 0; i < 8; i++) spawnTarget();

    // --- Shooting Mechanism (Raycasting) ---
    const raycaster = new THREE.Raycaster();
    const centerScreen = new THREE.Vector2(0, 0);

    function shoot() {
      if (!controls.isLocked || isReloading || ammo <= 0) return;

      ammo--;
      document.getElementById('ammo').innerText = ammo;

      // Gun recoil animation
      gunGroup.position.z += 0.08;
      setTimeout(() => { gunGroup.position.z -= 0.08; }, 60);

      raycaster.setFromCamera(centerScreen, camera);
      const intersects = raycaster.intersectObjects(targets);

      if (intersects.length > 0) {
        const hitTarget = intersects[0].object;
        createHitExplosion(hitTarget.position);

        scene.remove(hitTarget);
        const index = targets.indexOf(hitTarget);
        if (index > -1) targets.splice(index, 1);

        score += 100;
        document.getElementById('score').innerText = score;
        spawnTarget();
      }
    }

    function reload() {
      if (isReloading || ammo === maxAmmo) return;
      isReloading = true;
      document.getElementById('ammo').innerText = 'RELOADING...';
      setTimeout(() => {
        ammo = maxAmmo;
        document.getElementById('ammo').innerText = ammo;
        isReloading = false;
      }, 1200);
    }

    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) shoot();
    });

    // --- Particle Effects on Hit ---
    const particles = [];
    const pGeo = new THREE.BufferGeometry();
    const pCount = 20;
    const pPositions = new Float32Array(pCount * 3);
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));

    function createHitExplosion(pos) {
      const pMat = new THREE.PointsMaterial({ color: 0xff8787, size: 0.15 });
      const pMesh = new THREE.Points(pGeo.clone(), pMat);
      pMesh.position.copy(pos);

      const velocities = [];
      for (let i = 0; i < pCount; i++) {
        velocities.push(new THREE.Vector3(
          (Math.random() - 0.5) * 6,
          (Math.random() - 0.5) * 6,
          (Math.random() - 0.5) * 6
        ));
      }

      scene.add(pMesh);
      particles.push({ mesh: pMesh, velocities: velocities, life: 0.4 });
    }

    // --- Window Resize Handling ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Main Game Loop ---
    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      prevTime = time;

      if (controls.isLocked) {
        // Friction / damping
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveState.forward) - Number(moveState.backward);
        direction.x = Number(moveState.right) - Number(moveState.left);
        direction.normalize();

        const speed = 60.0;
        if (moveState.forward || moveState.backward) velocity.z -= direction.z * speed * delta;
        if (moveState.left || moveState.right) velocity.x -= direction.x * speed * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);

        // Keep player locked inside arena bounds
        camera.position.x = Math.max(-45, Math.min(45, camera.position.x));
        camera.position.z = Math.max(-45, Math.min(45, camera.position.z));
      }

      // Update particle decay
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= delta;
        const positions = p.mesh.geometry.attributes.position.array;
        for (let j = 0; j < pCount; j++) {
          positions[j * 3] += p.velocities[j].x * delta;
          positions[j * 3 + 1] += p.velocities[j].y * delta;
          positions[j * 3 + 2] += p.velocities[j].z * delta;
        }
        p.mesh.geometry.attributes.position.needsUpdate = true;

        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }

      // Animate floating targets
      targets.forEach((target, i) => {
        target.position.y += Math.sin(time * 0.003 + i) * 0.005;
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
