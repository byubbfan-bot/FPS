<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB: Road to the Show RPG</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #070a0e;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .stadium-bezel {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.9), 0 0 20px rgba(0, 206, 203, 0.2);
            overflow: hidden;
            width: 800px;
        }
        .broadcast-bar {
            background: #0d1117;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00cecb;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 0.8px;
            color: #00cecb;
            text-transform: uppercase;
        }
        .broadcast-bar .live-badge {
            background: #e3b341;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 6px;
        }
        canvas {
            display: block;
            background: #000;
            width: 800px;
            height: 520px;
        }
        .hud-footer {
            background: #0d1117;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #21262d;
            font-size: 13px;
        }
        .control-pill {
            background: #21262d;
            border: 1px solid #30363d;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            color: #e3b341;
        }
    </style>
</head>
<body>

<div class="stadium-bezel">
    <div class="broadcast-bar">
        <div><span class="live-badge">RTTS</span> <span id="hdr-tier">SINGLE-A AFFILIATE</span></div>
        <div id="hdr-stats">AVG: .000 | HR: 0 | OVR: 62</div>
    </div>

    <canvas id="gameCanvas" width="800" height="520"></canvas>

    <div class="hud-footer">
        <div>
            <span class="control-pill">WASD / ARROWS</span> Walk in Clubhouse | 
            <span class="control-pill">SPACE / ENTER</span> Swing Bat / Interact | 
            <span class="control-pill">T</span> Take Pitch
        </div>
        <div id="sub-hint" style="color:#8b949e; font-weight:600;">Walk up to the Dugout Tunnel to Take the Field</div>
    </div>
</div>

<script>
/* ==========================================================================
   AUDIO SYNTHESIZER (REAL CRACK OF THE BAT, UMPIRE CALLS)
   ========================================================================== */
let audioCtx = null;
function playFx(type) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const t = audioCtx.currentTime;

        if (type === "bat_crack") {
            // Realistic resonant wooden bat crack
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(420, t);
            osc.frequency.exponentialRampToValueAtTime(80, t + 0.16);
            gain.gain.setValueAtTime(0.7, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.16);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.16);
        } else if (type === "mitt_pop") {
            // Catcher's leather mitt snap
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(120, t);
            osc.frequency.linearRampToValueAtTime(40, t + 0.08);
            gain.gain.setValueAtTime(0.5, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.08);
        } else if (type === "cheer") {
            // Crowd roar noise burst
            const bufferSize = audioCtx.sampleRate * 0.4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.setValueAtTime(800, t);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.4);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(t);
            noise.stop(t + 0.4);
        }
    } catch(e) {}
}

/* ==========================================================================
   GAME ENGINE & CAREER SYSTEM
   ========================================================================== */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const TIERS = [
    { name: "Single-A: Modesto Nuts", pitcher: "C. Hammer", velo: 92, targetXP: 100 },
    { name: "Double-A: Arkansas Travelers", pitcher: "J. Santos", velo: 96, targetXP: 240 },
    { name: "Triple-A: Tacoma Rainiers", pitcher: "T. Vance", velo: 99, targetXP: 450 },
    { name: "MLB: The Show", pitcher: "G. Cole", velo: 102, targetXP: 9999 }
];

const player = {
    name: "Brennan",
    position: "SS",
    tierIdx: 0,
    contact: 60,
    power: 58,
    vision: 55,
    speed: 62,
    xp: 0,
    atBats: 0,
    hits: 0,
    hrs: 0,
    // Clubhouse coordinates
    x: 400,
    y: 340,
    dir: "up"
};

let scene = "CLUBHOUSE"; // CLUBHOUSE, AT_BAT, DIALOGUE

// Live Pitching Physics & At-Bat System
const atBat = {
    balls: 0,
    strikes: 0,
    pitchState: "IDLE", // IDLE, WINDUP, IN_FLIGHT, CONTACT, RESULT
    ballX: 400,
    ballY: 180,
    ballZ: 1, // scale
    targetX: 400,
    targetY: 415,
    pitchProgress: 0,
    swingFrame: 0,
    isSwinging: false,
    bannerText: "Step In. Pitcher is looking in for the sign.",
    bannerSub: "Press [SPACE] or Click to Time Your Swing | [T] to Take",
    bannerTimer: 0
};

/* ==========================================================================
   INPUTS
   ========================================================================== */
const keys = {};
window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
    if (scene === "CLUBHOUSE") {
        if (e.key === " " || e.key === "Enter") interactClubhouse();
    } else if (scene === "AT_BAT") {
        if (e.key === " " || e.key === "Enter") triggerSwing();
        if (e.key.toLowerCase() === "t") triggerTake();
    }
});
window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});
canvas.addEventListener("mousedown", () => {
    if (scene === "AT_BAT") triggerSwing();
});

/* ==========================================================================
   CLUBHOUSE OVERWORLD ENGINE
   ========================================================================== */
function updateClubhouse() {
    let speed = 3.5;
    if (keys["w"] || keys["arrowup"]) { player.y -= speed; player.dir = "up"; }
    if (keys["s"] || keys["arrowdown"]) { player.y += speed; player.dir = "down"; }
    if (keys["a"] || keys["arrowleft"]) { player.x -= speed; player.dir = "left"; }
    if (keys["d"] || keys["arrowright"]) { player.x += speed; player.dir = "right"; }

    player.x = Math.max(80, Math.min(720, player.x));
    player.y = Math.max(140, Math.min(460, player.y));

    // Tunnel Trigger to Stadium Diamond (X: 340 - 460, Y < 160)
    if (player.x > 340 && player.x < 460 && player.y <= 150) {
        startLiveAtBat();
    }
}

function interactClubhouse() {
    // Batting cage station on left
    if (player.x < 240 && player.y > 220 && player.y < 340) {
        player.contact += 1;
        player.xp += 10;
        showBannerNotification("Hitting Coach: Clean swing mechanics! Contact +1");
    }
    // Weight Rack on right
    if (player.x > 560 && player.y > 220 && player.y < 340) {
        player.power += 1;
        player.xp += 10;
        showBannerNotification("Strength Coach: Crushing reps! Power +1");
    }
}

function showBannerNotification(text) {
    const el = document.getElementById("sub-hint");
    el.innerText = text;
    el.style.color = "#e3b341";
    setTimeout(() => {
        el.innerText = "Walk up to the Dugout Tunnel to Take the Field";
        el.style.color = "#8b949e";
    }, 2800);
}

function renderClubhouse() {
    // Wood locker room floor
    ctx.fillStyle = "#8a5832";
    ctx.fillRect(0, 0, 800, 520);

    // Carpet runner with organization logo in center
    ctx.fillStyle = "#0c2340";
    ctx.fillRect(260, 140, 280, 340);
    ctx.strokeStyle = "#e3b341";
    ctx.lineWidth = 4;
    ctx.strokeRect(260, 140, 280, 340);

    ctx.fillStyle = "#e3b341";
    ctx.font = "900 24px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("CLUBHOUSE", 400, 310);
    ctx.font = "700 12px -apple-system, sans-serif";
    ctx.fillText(TIERS[player.tierIdx].name.toUpperCase(), 400, 330);

    // North Tunnel leading out to the Stadium Field
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(340, 60, 120, 80);
    ctx.fillStyle = "#22c55e"; // bright daylight spill
    ctx.fillRect(360, 60, 80, 20);
    ctx.fillStyle = "#fff";
    ctx.font = "800 12px sans-serif";
    ctx.fillText("DUGOUT TUNNEL", 400, 110);
    ctx.fillText("▲ FIELD ▲", 400, 130);

    // Left Side: Batting Cage Area
    ctx.fillStyle = "#16202c";
    ctx.fillRect(40, 180, 180, 180);
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2;
    ctx.strokeRect(40, 180, 180, 180);
    ctx.fillStyle = "#38bdf8";
    ctx.fillText("BATTING CAGE", 130, 260);
    ctx.font = "11px sans-serif";
    ctx.fillStyle = "#cbd5e1";
    ctx.fillText("[SPACE] Drill Reps (+CON)", 130, 285);

    // Right Side: Weight & Fitness Center
    ctx.fillStyle = "#16202c";
    ctx.fillRect(580, 180, 180, 180);
    ctx.strokeStyle = "#f87171";
    ctx.lineWidth = 2;
    ctx.strokeRect(580, 180, 180, 180);
    ctx.fillStyle = "#f87171";
    ctx.font = "800 12px sans-serif";
    ctx.fillText("WEIGHT ROOM", 670, 260);
    ctx.font = "11px sans-serif";
    ctx.fillStyle = "#cbd5e1";
    ctx.fillText("[SPACE] Heavy Squats (+PWR)", 670, 285);

    // Draw Player in Clubhouse
    drawClubhousePlayer(player.x, player.y);
}

function drawClubhousePlayer(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // Drop shadow
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.ellipse(0, 18, 14, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cleats
    ctx.fillStyle = "#111";
    ctx.fillRect(-10, 14, 8, 6);
    ctx.fillRect(2, 14, 8, 6);

    // Baseball Pants (Grey/White with piping)
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(-10, -2, 20, 16);
    ctx.fillStyle = "#00cecb";
    ctx.fillRect(-1, -2, 2, 16); // Piping

    // Jersey & Belt
    ctx.fillStyle = "#0c2340";
    ctx.fillRect(-11, -16, 22, 14);
    ctx.fillStyle = "#e3b341"; // Number / Trim
    ctx.font = "bold 9px sans-serif";
    ctx.fillText("24", 0, -6);

    // Head & Cap
    ctx.fillStyle = "#dfa070";
    ctx.beginPath();
    ctx.arc(0, -22, 7, 0, Math.PI * 2);
    ctx.fill();

    // Cap with visor
    ctx.fillStyle = "#0c2340";
    ctx.beginPath();
    ctx.arc(0, -25, 7, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-2, -26, 12, 3); // Visor

    ctx.restore();
}

/* ==========================================================================
   AUTHENTIC 3D-PERSPECTIVE BROADCAST BALLPARK & AT-BAT SCENE
   ========================================================================== */
function startLiveAtBat() {
    scene = "AT_BAT";
    atBat.balls = 0;
    atBat.strikes = 0;
    atBat.pitchState = "IDLE";
    atBat.bannerText = `Batting: ${player.name} vs. ${TIERS[player.tierIdx].pitcher}`;
    atBat.bannerSub = `Fastball Velo: ${TIERS[player.tierIdx].velo} MPH | Time the ball crossing the plate!`;

    // Queue pitcher delivery
    setTimeout(startPitchDelivery, 1200);
}

function startPitchDelivery() {
    if (scene !== "AT_BAT") return;
    atBat.pitchState = "IN_FLIGHT";
    atBat.ballX = 400;
    atBat.ballY = 195;
    atBat.ballZ = 0.35;
    atBat.pitchProgress = 0;
    atBat.isSwinging = false;
    atBat.swingFrame = 0;

    // Pitch target around the strike zone (370 - 430 X, 395 - 435 Y)
    let inZone = Math.random() < 0.65;
    atBat.targetX = inZone ? 385 + Math.random() * 30 : 355 + Math.random() * 90;
    atBat.targetY = inZone ? 405 + Math.random() * 25 : 380 + Math.random() * 65;
}

function updateAtBatPhysics() {
    if (atBat.pitchState === "IN_FLIGHT") {
        // High-velocity flight scaled to tier
        let speed = 0.038 + (player.tierIdx * 0.005);
        atBat.pitchProgress += speed;

        atBat.ballX = 400 + (atBat.targetX - 400) * atBat.pitchProgress;
        atBat.ballY = 195 + (atBat.targetY - 195) * atBat.pitchProgress;
        atBat.ballZ = 0.35 + (atBat.pitchProgress * 1.4);

        // Reached the plate
        if (atBat.pitchProgress >= 1.0) {
            atBat.pitchState = "RESULT";
            playFx("mitt_pop");

            // Evaluate take
            let isStrike = (atBat.targetX >= 370 && atBat.targetX <= 430 && atBat.targetY >= 390 && atBat.targetY <= 440);
            if (isStrike) {
                atBat.strikes++;
                atBat.bannerText = "Called Strike on the Corner!";
            } else {
                atBat.balls++;
                atBat.bannerText = "Ball! Missed outside the zone.";
            }

            checkCountResolution();
        }
    }

    if (atBat.isSwinging) {
        atBat.swingFrame += 0.22;
        if (atBat.swingFrame > Math.PI) {
            atBat.isSwinging = false;
        }
    }
}

function triggerTake() {
    if (atBat.pitchState !== "IN_FLIGHT") return;
    atBat.bannerSub = "Taking pitch... watching the flight path.";
}

function triggerSwing() {
    if (scene !== "AT_BAT") return;
    atBat.isSwinging = true;
    atBat.swingFrame = 0;

    if (atBat.pitchState === "IN_FLIGHT") {
        let timingDiff = Math.abs(atBat.pitchProgress - 0.92);

        if (timingDiff < 0.14) {
            // Barrel on ball!
            atBat.pitchState = "CONTACT";
            playFx("bat_crack");
            playFx("cheer");

            player.atBats++;
            player.hits++;

            let isPowerHit = timingDiff < 0.06 && player.power >= 58;
            if (isPowerHit) {
                player.hrs++;
                player.xp += 50;
                atBat.bannerText = "🔥 HOME RUN!! CRUSHED 440 FEET OVER THE CENTERFIELD WALL!";
            } else {
                player.xp += 25;
                atBat.bannerText = "⚾ SHOT INTO THE GAP! Clean Line-Drive Base Hit!";
            }
            updateDOMStats();

            setTimeout(() => {
                checkPromotion();
                scene = "CLUBHOUSE";
            }, 2400);
        } else {
            // Whiffed
            playFx("mitt_pop");
            atBat.strikes++;
            atBat.bannerText = "Swing and a Miss! Fooled on timing.";
            atBat.pitchState = "RESULT";
            checkCountResolution();
        }
    }
}

function checkCountResolution() {
    updateDOMStats();
    if (atBat.strikes >= 3) {
        player.atBats++;
        atBat.bannerText = "STRIKE THREE! Down on strikes. Walk back to the dugout.";
        setTimeout(() => { scene = "CLUBHOUSE"; }, 2000);
    } else if (atBat.balls >= 4) {
        player.atBats++;
        player.xp += 20;
        atBat.bannerText = "BALL FOUR! Drew the walk! Outstanding plate discipline.";
        setTimeout(() => {
            checkPromotion();
            scene = "CLUBHOUSE";
        }, 2000);
    } else {
        setTimeout(startPitchDelivery, 1600);
    }
}

function checkPromotion() {
    let curTier = TIERS[player.tierIdx];
    if (player.xp >= curTier.targetXP && player.tierIdx < TIERS.length - 1) {
        player.tierIdx++;
        showBannerNotification(`🚨 PROMOTION CALL-UP! You made it to ${TIERS[player.tierIdx].name}!`);
        document.getElementById("hdr-tier").innerText = TIERS[player.tierIdx].name.toUpperCase();
    }
}

function updateDOMStats() {
    let avg = player.atBats > 0 ? (player.hits / player.atBats).toFixed(3).replace(/^0/, "") : ".000";
    document.getElementById("hdr-stats").innerText = `AVG: ${avg} | HR: ${player.hrs} | OVR: ${Math.floor((player.contact + player.power + player.vision) / 3)}`;
}

/* ==========================================================================
   RENDER THE 3D BALLPARK ENVIRONMENT
   ========================================================================== */
function renderBallpark() {
    // 1. Summer Sky & Outfield Skyline
    let skyGradient = ctx.createLinearGradient(0, 0, 0, 160);
    skyGradient.addColorStop(0, "#0284c7");
    skyGradient.addColorStop(1, "#bae6fd");
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, 800, 160);

    // Outfield Stadium Wall & Bleachers
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0, 100, 800, 40);
    ctx.fillStyle = "#047857"; // Green Monster / Outfield Padded Wall
    ctx.fillRect(0, 130, 800, 30);
    ctx.fillStyle = "#fbbf24";
    ctx.font = "800 12px sans-serif";
    ctx.fillText("330", 40, 150);
    ctx.fillText("405", 400, 150);
    ctx.fillText("330", 760, 150);

    // Yellow Foul Poles
    ctx.fillStyle = "#facc15";
    ctx.fillRect(36, 40, 4, 110);
    ctx.fillRect(764, 40, 4, 110);

    // 2. Outfield Warning Track Dirt
    ctx.fillStyle = "#9a6538";
    ctx.beginPath();
    ctx.ellipse(400, 160, 420, 60, 0, 0, Math.PI);
    ctx.fill();

    // 3. Outfield & Infield Turf (Mower Patterned Stripes)
    let turfGrad = ctx.createLinearGradient(0, 160, 0, 520);
    turfGrad.addColorStop(0, "#15803d");
    turfGrad.addColorStop(1, "#166534");
    ctx.fillStyle = turfGrad;
    ctx.fillRect(0, 160, 800, 360);

    // Mower Stripes
    ctx.fillStyle = "rgba(255,255,255,0.04)";
    for (let x = 0; x < 800; x += 40) {
        ctx.fillRect(x, 160, 20, 360);
    }

    // 4. Infield Dirt Diamond & Clay Cutouts
    ctx.fillStyle = "#b07d4b";
    ctx.beginPath();
    ctx.ellipse(400, 380, 260, 130, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#8c5628";
    ctx.lineWidth = 4;
    ctx.stroke();

    // 5. Pitcher's Mound (Elevated 3D Hill)
    ctx.fillStyle = "#8c5628";
    ctx.beginPath();
    ctx.ellipse(400, 210, 42, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffffff"; // Pitching rubber
    ctx.fillRect(392, 208, 16, 4);

    // 6. Home Plate & White Chalked Batter's Boxes
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(400, 442);
    ctx.lineTo(410, 432);
    ctx.lineTo(410, 422);
    ctx.lineTo(390, 422);
    ctx.lineTo(390, 432);
    ctx.closePath();
    ctx.fill();

    // Batter's Box Chalk Outlines
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 3;
    ctx.strokeRect(335, 395, 45, 65); // Righty box
    ctx.strokeRect(420, 395, 45, 65); // Lefty box

    // 7. Pitcher Model on the Mound (Windup & Stance)
    drawPitcher(400, 185);

    // 8. Live Pitch in Flight
    if (atBat.pitchState === "IN_FLIGHT") {
        ctx.save();
        // Baseball shadow
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.ellipse(atBat.ballX, atBat.ballY + 14 * atBat.ballZ, 4 * atBat.ballZ, 2 * atBat.ballZ, 0, 0, Math.PI * 2);
        ctx.fill();

        // White Leather Ball with Red Stitches
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(atBat.ballX, atBat.ballY, 5 * atBat.ballZ, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#dc2626";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
    }

    // 9. Authentic Batter in Box with Animated Swing
    drawBatter(352, 425, atBat.isSwinging, atBat.swingFrame);

    // 10. TV Broadcast Overlay (Balls, Strikes, Pitch Velo)
    renderBroadcastHUD();
}

function drawPitcher(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // Uniform Pants
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(-6, 0, 5, 18);
    ctx.fillRect(1, 0, 5, 18);

    // Pinstripes
    ctx.fillStyle = "#0c2340";
    ctx.fillRect(-4, 0, 1, 18);
    ctx.fillRect(3, 0, 1, 18);

    // Jersey & Glove
    ctx.fillStyle = "#0c2340";
    ctx.fillRect(-8, -14, 16, 15);
    ctx.fillStyle = "#9a6538"; // Tan leather glove
    ctx.fillRect(-12, -10, 6, 6);

    // Head & Cap
    ctx.fillStyle = "#dfa070";
    ctx.beginPath();
    ctx.arc(0, -18, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#0c2340";
    ctx.fillRect(-4, -23, 8, 4);

    ctx.restore();
}

function drawBatter(x, y, isSwinging, swingFrame) {
    ctx.save();
    ctx.translate(x, y);

    // Batter Shadow
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.ellipse(0, 12, 16, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Spiked Baseball Cleats
    ctx.fillStyle = "#111";
    ctx.fillRect(-8, 8, 6, 6);
    ctx.fillRect(4, 8, 6, 6);

    // Baseball Pants (Home Whites)
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(-8, -8, 6, 18);
    ctx.fillRect(3, -8, 6, 18);
    // Navy piping down sides
    ctx.fillStyle = "#00cecb";
    ctx.fillRect(-9, -8, 1, 18);
    ctx.fillRect(8, -8, 1, 18);

    // Jersey (Authentic Pro Cut)
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(-9, -24, 19, 17);
    ctx.fillStyle = "#00cecb";
    ctx.fillRect(-1, -24, 2, 17); // Pinstripe

    // Arms & Batting Gloves
    ctx.fillStyle = "#dfa070";
    ctx.fillRect(8, -20, 6, 10);
    ctx.fillStyle = "#e3b341"; // Gold Batting Gloves
    ctx.fillRect(11, -23, 6, 6);

    // Head, Eye Black & Batting Helmet with Earflap
    ctx.fillStyle = "#dfa070";
    ctx.beginPath();
    ctx.arc(0, -29, 6, 0, Math.PI * 2);
    ctx.fill();
    // Eye black strips
    ctx.fillStyle = "#000";
    ctx.fillRect(2, -28, 4, 1.5);

    // Navy Batting Helmet
    ctx.fillStyle = "#0c2340";
    ctx.beginPath();
    ctx.arc(0, -32, 7, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(1, -34, 7, 4); // Earflap facing pitcher

    // Wooden Maple Bat with Pine Tar (Rotates on Swing)
    ctx.save();
    ctx.translate(14, -22);
    if (isSwinging) {
        ctx.rotate(-swingFrame * 1.5);
    } else {
        ctx.rotate(0.3); // Ready Stance
    }
    // Maple Barrel
    ctx.fillStyle = "#b4793f";
    ctx.fillRect(-2, -36, 4, 38);
    // Pine Tar Handle Grip
    ctx.fillStyle = "#1e1b18";
    ctx.fillRect(-2, -10, 4, 12);
    ctx.restore();

    ctx.restore();
}

function renderBroadcastHUD() {
    // Scorebug in top left
    ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
    ctx.fillRect(18, 16, 210, 52);
    ctx.strokeStyle = "#00cecb";
    ctx.lineWidth = 2;
    ctx.strokeRect(18, 16, 210, 52);

    ctx.fillStyle = "#e3b341";
    ctx.font = "800 11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`P: ${TIERS[player.tierIdx].pitcher}`, 28, 33);
    ctx.fillStyle = "#cbd5e1";
    ctx.font = "700 10px sans-serif";
    ctx.fillText(`FASTBALL: ${TIERS[player.tierIdx].velo} MPH`, 28, 52);

    // Count Box (Top Right)
    ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
    ctx.fillRect(660, 16, 120, 52);
    ctx.strokeStyle = "#e3b341";
    ctx.lineWidth = 2;
    ctx.strokeRect(660, 16, 120, 52);

    ctx.fillStyle = "#e3b341";
    ctx.font = "800 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("COUNT", 720, 32);
    ctx.fillStyle = "#00cecb";
    ctx.font = "900 18px monospace";
    ctx.fillText(`${atBat.balls} - ${atBat.strikes}`, 720, 53);

    // Plate Coverage Indicator (PCI) Reticle
    ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
    ctx.lineWidth = 2;
    ctx.strokeRect(375, 395, 50, 48); // Strike zone box
    ctx.beginPath();
    ctx.arc(400, 419, 14, 0, Math.PI * 2);
    ctx.stroke();

    // Broadcast Lower-Third Banner
    ctx.fillStyle = "rgba(13, 17, 23, 0.95)";
    ctx.fillRect(60, 460, 680, 50);
    ctx.strokeStyle = "#30363d";
    ctx.lineWidth = 2;
    ctx.strokeRect(60, 460, 680, 50);

    ctx.fillStyle = "#facc15";
    ctx.font = "800 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(atBat.bannerText, 400, 482);
    ctx.fillStyle = "#94a3b8";
    ctx.font = "600 11px sans-serif";
    ctx.fillText(atBat.bannerSub, 400, 498);
}

/* ==========================================================================
   MAIN GAME LOOP
   ========================================================================== */
function gameLoop() {
    ctx.clearRect(0, 0, 800, 520);

    if (scene === "CLUBHOUSE") {
        updateClubhouse();
        renderClubhouse();
    } else if (scene === "AT_BAT") {
        updateAtBatPhysics();
        renderBallpark();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
